# zizmor configuration — https://docs.zizmor.sh/configuration/
#
# Known accepted risks:
#   - ci.yml's test/lint/coverage jobs cache mise tool installs
#     (`jdx/mise-action` with `cache: true`). zizmor flags this as a
#     cache-poisoning vector because the file also publishes a GitHub
#     Release (the inline `release` job, gated on a `v*` tag push). The
#     mitigation: that release job sets `cache: false` so it never
#     restores a cache, and the cached jobs produce no release artifacts
#     — GitHub's per-ref cache scoping keeps a PR branch's cache out of
#     the protected main/tag refs the release runs on. There is no path
#     from a poisoned cache to a trusted build.

rules:
  cache-poisoning:
    ignore:
      - ci.yml
